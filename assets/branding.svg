<svg viewBox="0 0 500 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic cyan to deep blue gradient -->
    <linearGradient id="trGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Highlight gradient for top bar -->
    <linearGradient id="trTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="270" fill="#090d16" rx="16" />

  <!-- Logo Group -->
  <g transform="translate(0, 5)">
    <!-- TR Monogram Emblem -->
    <g transform="translate(182, 22)">
      <!-- T Top Bar -->
      <path d="M 0 0 L 82 0 C 108 0 120 14 120 28 C 120 42 108 52 88 52 L 48 52 L 48 24 L 0 24 Z" fill="url(#trTopGrad)" />
      
      <!-- T Left Stem -->
      <path d="M 0 0 L 40 0 L 40 136 L 18 136 L 0 120 Z" fill="url(#trGradient)" />
      
      <!-- R Loop Outer Arch -->
      <path d="M 40 32 C 40 22 52 18 68 18 C 104 18 124 30 124 58 C 124 86 104 98 68 98 L 40 98 Z" fill="url(#trGradient)" />
      
      <!-- R Inner Cutout -->
      <path d="M 64 38 C 58 38 56 42 56 48 L 56 78 L 68 78 C 84 78 98 70 98 58 C 98 46 84 38 68 38 Z" fill="#090d16" />

      <!-- R Swooping Leg -->
      <path d="M 64 88 L 92 88 C 98 88 104 92 108 98 L 130 132 C 134 137 129 142 122 142 L 98 142 L 74 98 L 64 98 Z" fill="url(#trGradient)" />
    </g>

    <!-- TrustRide Text Branding -->
    <text x="250" y="222" text-anchor="middle" fill="#ffffff" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="54" letter-spacing="-0.5px">TrustRide</text>
  </g>
</svg>
