<svg viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan to Royal Blue Metallic Gradient (Matches TrustRideBranding.png) -->
    <linearGradient id="trGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="trGradStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="trGradLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle Cyan Drop Shadow -->
    <filter id="trGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <!-- TR Emblem Monogram (1:1 geometry match to TrustRideBranding.png) -->
    <g transform="translate(290, 25)" filter="url(#trGlow)">
      <!-- Outer Top Bar of T + Upper Arch of R -->
      <path d="M 0 0 L 122 0 C 172 0 202 24 202 64 C 202 104 172 124 128 124 L 92 124 L 92 84 L 122 84 C 144 84 156 74 156 64 C 156 52 144 42 122 42 L 0 42 Z" fill="url(#trGradTop)" />

      <!-- Left Vertical Stem of T with Shield Point Bottom -->
      <path d="M 0 0 L 46 0 L 46 156 C 46 182 23 202 23 202 C 23 202 0 182 0 156 Z" fill="url(#trGradStem)" />

      <!-- Inner T Arm underneath top bar -->
      <path d="M 46 42 L 112 42 C 124 42 130 48 130 56 C 130 64 124 70 112 70 L 46 70 Z" fill="url(#trGradTop)" />

      <!-- R Diagonal Leg -->
      <path d="M 116 120 L 156 120 C 166 120 173 125 179 135 L 209 194 C 213 202 207 210 197 210 L 161 210 L 133 154 L 116 154 Z" fill="url(#trGradLeg)" />
    </g>

    <!-- TrustRide Text in Pure White for High Contrast -->
    <text x="400" y="348" text-anchor="middle" fill="#ffffff" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="82" letter-spacing="-1px">TrustRide</text>
  </g>
</svg>
